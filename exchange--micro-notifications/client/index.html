<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notifications Microservice Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
      <header class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Notifications Microservice Client</h1>
        <p class="text-sm text-gray-600">Test sending Email/SMS, view job status, and check health.</p>
      </header>

      <section class="mb-6 bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-4">Configuration</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Base URL</label>
            <input id="baseUrl" type="text" class="w-full rounded border-gray-300" placeholder="http://localhost:7002" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Bearer Token</label>
            <input id="bearerToken" type="password" class="w-full rounded border-gray-300" placeholder="service token" />
          </div>
          <div class="flex items-end">
            <button id="saveConfigBtn" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
            <button id="pingBtn" class="ml-2 inline-flex items-center px-4 py-2 bg-gray-100 text-gray-800 rounded hover:bg-gray-200">Ping</button>
          </div>
        </div>
      </section>

      <nav class="mb-4 flex gap-2">
        <button data-tab="email" class="tab-btn px-4 py-2 rounded bg-blue-600 text-white">Email</button>
        <button data-tab="sms" class="tab-btn px-4 py-2 rounded bg-gray-100">SMS</button>
        <button data-tab="status" class="tab-btn px-4 py-2 rounded bg-gray-100">Job Status</button>
        <button data-tab="health" class="tab-btn px-4 py-2 rounded bg-gray-100">Health</button>
      </nav>

      <section id="tab-email" class="tab-panel bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-4">Send Email</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">To (email)</label>
            <input id="emailTo" type="email" class="w-full rounded border-gray-300" placeholder="user@example.com" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Template</label>
            <select id="emailTemplate" class="w-full rounded border-gray-300">
              <option value="auth.verify-email">auth.verify-email</option>
              <option value="auth.reset-password">auth.reset-password</option>
              <option value="auth.welcome">auth.welcome</option>
              <option value="auth.otp">auth.otp</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
            <input id="emailSubject" type="text" class="w-full rounded border-gray-300" placeholder="Subject" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
            <select id="emailPriority" class="w-full rounded border-gray-300">
              <option value="normal">normal</option>
              <option value="high">high</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">User ID (UUID)</label>
            <input id="emailUserId" type="text" class="w-full rounded border-gray-300" placeholder="uuid" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Org ID (optional)</label>
            <input id="emailOrgId" type="text" class="w-full rounded border-gray-300" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Idempotency Key (optional)</label>
            <input id="emailIdemKey" type="text" class="w-full rounded border-gray-300" />
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Variables (JSON)</label>
            <textarea id="emailVariables" class="w-full rounded border-gray-300 h-40 font-mono text-sm"></textarea>
          </div>
        </div>
        <div class="mt-4">
          <button id="sendEmailBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Send Email</button>
        </div>
      </section>

      <section id="tab-sms" class="tab-panel hidden bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-4">Send SMS</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">To (phone)</label>
            <input id="smsTo" type="text" class="w-full rounded border-gray-300" placeholder="+1xxxxxxxxxx" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Template</label>
            <select id="smsTemplate" class="w-full rounded border-gray-300">
              <option value="auth.otp">auth.otp</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
            <select id="smsPriority" class="w-full rounded border-gray-300">
              <option value="normal">normal</option>
              <option value="high">high</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">User ID (UUID)</label>
            <input id="smsUserId" type="text" class="w-full rounded border-gray-300" placeholder="uuid" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Org ID (optional)</label>
            <input id="smsOrgId" type="text" class="w-full rounded border-gray-300" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Idempotency Key (optional)</label>
            <input id="smsIdemKey" type="text" class="w-full rounded border-gray-300" />
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Variables (JSON)</label>
            <textarea id="smsVariables" class="w-full rounded border-gray-300 h-40 font-mono text-sm"></textarea>
          </div>
        </div>
        <div class="mt-4">
          <button id="sendSmsBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Send SMS</button>
        </div>
      </section>

      <section id="tab-status" class="tab-panel hidden bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-4">Job Status</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Queue</label>
            <select id="statusQueue" class="w-full rounded border-gray-300">
              <option value="email">email</option>
              <option value="sms">sms</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Job ID</label>
            <input id="statusJobId" type="text" class="w-full rounded border-gray-300" placeholder="job id" />
          </div>
        </div>
        <div class="mt-4">
          <button id="checkStatusBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Check Status</button>
        </div>
      </section>

      <section id="tab-health" class="tab-panel hidden bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-4">Health</h2>
        <button id="checkHealthBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Check Health</button>
      </section>

      <section class="mt-6 bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-2">Response</h2>
        <pre id="responseBox" class="bg-gray-900 text-gray-200 rounded p-3 text-sm overflow-auto max-h-96"></pre>
      </section>
    </div>

    <script src="./app.js"></script>
  </body>
  </html>
